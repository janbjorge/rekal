[build-system]
requires = ["hatchling>=1.31.0,<2", "hatch-vcs>=0.5.0,<0.6"]
build-backend = "hatchling.build"

[project]
name = "rekal"
dynamic = ["version"]
description = "Long-term memory MCP server for LLMs — hybrid search in a single SQLite file"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jan Bjorge" }]
keywords = ["mcp", "memory", "llm", "sqlite", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "aiosqlite>=0.22.1,<0.23",
    "sqlite-vec>=0.1.9,<0.2",
    "fastembed>=0.8.0,<0.9",
    "pydantic>=2.13.4,<3",
    "pyyaml>=6.0.3,<7",
    "typer>=0.27.0,<0.28",
]

[project.scripts]
rekal = "rekal.__main__:main"

[tool.hatch.version]
source = "vcs"
# Claude Code copies the plugin into its cache without .git; the hooks'
# `uv sync` builds rekal from that copy, so a VCS-less build must not fail.
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.hooks.vcs]
version-file = "rekal/_version.py"

[tool.ruff]
target-version = "py311"
line-length = 99
extend-exclude = ["rekal/_version.py"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "SIM",
    "TCH",
    "RUF",
    "PTH",
    "RET",
    "ARG",
    "ERA",
    "TID",
    "PL",
]
ignore = [
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "TCH001", "TCH002", "TCH003", "PLC0415", "ARG001"]
"rekal/adapters/tools/**" = ["TCH001", "TCH002"]
"rekal/__main__.py" = ["PLC0415"]
"rekal/embeddings.py" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["rekal"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["rekal"]

[tool.coverage.report]
fail_under = 100
show_missing = true
omit = ["rekal/_version.py"]

[dependency-groups]
dev = [
    "hypothesis>=6.165.0,<7",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.1,<0.17",
    "ty>=0.0.65,<0.1",
]
