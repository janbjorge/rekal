name: Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The plugin hooks run `uvx --from rekal==<pin>`; a release whose tag differs
  # from the pin ships hooks that run a different version than the one being
  # published. Refuse to release until the pin is bumped in the same commit.
  hook-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          pins=$(grep -o 'rekal==[0-9][0-9a-z.]*' hooks/hooks.json | sort -u)
          if [ "$pins" != "rekal==$tag" ]; then
            echo "::error::hooks/hooks.json pins '$pins' but the tag releases v$tag — bump the pin before tagging"
            exit 1
          fi

  build:
    needs: [ci, hook-pin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "${{ github.ref_name }}" --generate-notes || echo "Release already exists"
        env:
          GH_TOKEN: ${{ github.token }}
